[project]
name = "agentic-ai"
version = "0.1.0"
description = "Standalone agentic AI scripts extracted from the Udemy Agentic AI Engineering course"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.68.2",
    "openai-agents>=0.0.15",
    "crewai>=0.130.0",
    "langgraph>=0.3.18",
    "langchain-openai>=0.3.9",
    "autogen-agentchat>=0.4.9.2",
    "autogen-ext[openai]>=0.4.9.2",
    "mcp[cli]>=1.5.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
